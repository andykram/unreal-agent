version: "2"

run:
  timeout: 5m

linters:
  # Keep CI checks explicit and stable across linter upgrades.
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # Match standalone Staticcheck: quick-fix suggestions are opt-in.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*"]
  exclusions:
    presets: []
